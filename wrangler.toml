name = "mawg-streaming"
main = "src/worker.mjs"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat_v2", "enable_nodejs_http_server_modules"]

[assets]
directory = "./public"
binding = "ASSETS"
# CSS y scripts pasan por las rutas existentes: dist y autenticacion del admin.
run_worker_first = ["/admin", "/admin/", "/admin.html", "/api/*", "/styles.css", "/script.js", "/login.js", "/admin.js", "/admin-reports.js"]

[vars]
NODE_ENV = "production"
SITE_URL = "https://mawg-streaming.ventas-jnlogistic.workers.dev"
CATALOG_STORAGE = "apps-script"
# Interruptor de la Fase 3. Dejalo en "apps-script" hasta importar y verificar
# la migracion; luego cambia a "d1" y vuelve a desplegar (ver README).
OPERATIONS_STORAGE = "apps-script"
APPS_SCRIPT_TIMEOUT_MS = "15000"
APPS_SCRIPT_OPERATION_TIMEOUT_MS = "30000"
PUBLIC_API_CACHE_TTL_MS = "120000"
PROOF_UPLOAD_MAX_MB = "8"
SESSION_MAX_AGE_HOURS = "24"

[[kv_namespaces]]
binding = "SESSIONS"
id = "2ec208f26bc7471d801aa40263095daa"
preview_id = "ab345ac3dcde49329e48b3bc8ed93093"

[[d1_databases]]
binding = "DB"
database_name = "mawg-streaming-db"
database_id = "d066af57-af14-47f4-95d0-3101cb4a1dee"

# Estado de seguridad compartido; independiente de OPERATIONS_STORAGE y D1.
[[durable_objects.bindings]]
name = "SECURITY_STATE"
class_name = "SecurityState"

[[migrations]]
tag = "security-v1"
new_sqlite_classes = ["SecurityState"]
